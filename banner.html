<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybernetic Portfolio Banner</title>
  <style>
    :root {
      --bg-color-1: #070709;
      --bg-color-2: #0f0709;
      --bg-color-3: #050507;
      --primary-red: #ff2a45;
      --glow-red-1: #ff4458;
      --glow-red-2: #ff1a35;
      --border-red: #ef4444;
      --text-gray-light: #f1f5f9;
      --text-gray-dark: #64748b;
      --text-badge: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Outer Wrapper Container */
    .banner-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 220px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 50%, var(--bg-color-3) 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Ambient Glow Blobs Behind Content */
    .banner-container::before,
    .banner-container::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
    }

    .banner-container::before {
      top: -20px;
      left: 60px;
      width: 180px;
      height: 180px;
      background: #dc2626;
      opacity: 0.18;
    }

    .banner-container::after {
      bottom: -20px;
      right: 40px;
      width: 220px;
      height: 220px;
      background: #ff1a35;
      opacity: 0.14;
    }

    /* Subtle Cyber Tech Grid Overlay */
    .tech-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to right, rgba(239, 68, 68, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      border-radius: 14px;
      pointer-events: none;
      z-index: 2;
    }

    /* Neon Border Outline */
    .border-outline {
      position: absolute;
      top: 1.5px;
      left: 1.5px;
      right: 1.5px;
      bottom: 1.5px;
      border-radius: 13px;
      border: 1.5px solid transparent;
      background: linear-gradient(90deg, #7f1d1d, #ef4444, #ff4d6d, #ef4444, #7f1d1d) border-box;
      mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0.65;
      pointer-events: none;
      z-index: 5;
    }

    /* Cybernetic Corner Accents */
    .corner-accent {
      position: absolute;
      width: 18px;
      height: 16px;
      border: 3px solid var(--primary-red);
      pointer-events: none;
      z-index: 6;
    }
    .top-left     { top: 14px; left: 12px; border-right: none; border-bottom: none; border-radius: 3px 0 0 0; }
    .top-right    { top: 14px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 3px 0 0; }
    .bottom-left  { bottom: 14px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 3px; }
    .bottom-right { bottom: 14px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 3px 0; }

    /* Content Layout Container */
    .content-wrapper {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0 20px 0;
    }

    /* Status Pill Badge at Top Center */
    .status-badge {
      background-color: #17090b;
      border: 1px solid rgba(255, 42, 69, 0.7);
      padding: 5px 24px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--border-red);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }

    .badge-text {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-badge);
    }

    /* Main Name Header with Shimmer & Shadow */
    .title-container {
      position: relative;
      margin-top: 4px;
    }

    .title-text {
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      color: #ffffff;
      position: relative;
      z-index: 2;
    }

    /* Secondary Glow Text Layer underneath */
    .title-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      z-index: 1;
      background: linear-gradient(90deg, var(--glow-red-1), var(--glow-red-2), #ffffff, var(--primary-red));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: blur(8px) brightness(1.5);
      animation: shimmer 7s linear infinite;
    }

    /* Subtitle Tagline */
    .subtitle-text {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-top: -6px;
    }

    .span-red { color: var(--text-badge); }
    .span-dot { color: var(--text-gray-dark); margin: 0 4px; }
    .span-white { color: var(--text-gray-light); }

    /* Decorative Sleek Red Line with Diamond Split */
    .divider-line {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 15px;
      margin-top: 4px;
    }

    .line {
      height: 1.5px;
      width: 220px;
      background: linear-gradient(90deg, transparent, var(--border-red), transparent);
      opacity: 0.8;
    }

    .diamond {
      width: 8px;
      height: 8px;
      background-color: var(--border-red);
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--primary-red), 0 0 4px var(--primary-red);
    }

    /* Secondary Meta Tags at Bottom */
    .meta-tags {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 1.5px;
      text-align: center;
      text-transform: uppercase;
    }

    .code-symbol {
      color: var(--border-red);
      font-weight: bold;
    }

    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px var(--border-red); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <div class="banner-container">
    <!-- Visual Backdrops -->
    <div class="tech-grid"></div>
    <div class="border-outline"></div>
    
    <!-- Edge Accents -->
    <div class="corner-accent top-left"></div>
    <div class="corner-accent top-right"></div>
    <div class="corner-accent bottom-left"></div>
    <div class="corner-accent bottom-right"></div>

    <!-- Interface Content Elements -->
    <div class="content-wrapper">
      
      <!-- Top Status Capsule -->
      <div class="status-badge">
        <div class="pulse-dot"></div>
        <span class="badge-text">Building Real-World Tech</span>
      </div>

      <!-- Centerpiece Header Blocks -->
      <div class="title-container">
        <div class="title-glow">Kavya Gupta</div>
        <div class="title-text">Kavya Gupta</div>
      </div>

      <!-- Core Track Competencies -->
      <div class="subtitle-text">
        <span class="span-red">Computer Science Engineer</span>
        <span class="span-dot">•</span>
        <span class="span-white">Full Stack</span>
      </div>

      <!-- Geometric Split Lines -->
      <div class="divider-line">
        <div class="line"></div>
        <div class="diamond"></div>
        <div class="line"></div>
      </div>

      <!-- Secondary Terminal Subtitle Footer -->
      <div class="meta-tags">
        <span class="code-symbol">&lt;/&gt;</span> Turning Random Ideas Into Production Code
      </div>

    </div>
  </div>

</body>
</html>
